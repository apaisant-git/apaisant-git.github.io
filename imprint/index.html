<title>Imprint</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:#EEF1F5;color:#141B24;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
  .lock{width:100%;max-width:340px;background:#fff;border:1px solid #DCE3EA;border-radius:18px;
    padding:30px 26px;box-shadow:0 20px 50px -24px rgba(40,60,80,.5);text-align:center}
  .mark{font-weight:800;letter-spacing:.22em;font-size:15px;text-transform:uppercase}
  .mark b{color:#0B9A8B;font-weight:800}
  .ic{width:52px;height:52px;margin:6px auto 14px;border-radius:14px;background:#F0FBF9;border:1px solid #C7ECE6;display:grid;place-items:center}
  .ic svg{width:24px;height:24px;stroke:#0B9A8B}
  h1{font-size:16px;margin:0 0 4px}
  p{font-size:12.5px;color:#586573;margin:0 0 18px;line-height:1.5}
  input{width:100%;font-size:16px;padding:12px 14px;border:1px solid #C3CDD8;border-radius:10px;background:#F7F9FB;
    text-align:center;letter-spacing:.06em;outline:none}
  input:focus{border-color:#0B9A8B;box-shadow:0 0 0 3px rgba(11,154,139,.15)}
  button{width:100%;margin-top:12px;font-size:15px;font-weight:700;letter-spacing:.04em;color:#fff;background:#0B9A8B;
    border:0;border-radius:10px;padding:13px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#C0392B;font-size:12.5px;margin-top:12px;min-height:16px;font-weight:600}
  .foot{margin-top:16px;font-size:10.5px;color:#93A0AD}
</style>
</head>

async function derive(pass){
