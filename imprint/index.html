<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}

  .lock{width:100%;max-width:340px;background:#fff;border:1px solid #DCE3EA;border-radius:18px;
    padding:30px 26px;box-shadow:0 20px 50px -24px rgba(40,60,80,.5);text-align:center}

    text-align:center;letter-spacing:.06em;outline:none}

  button{width:100%;margin-top:12px;font-size:15px;font-weight:700;letter-spacing:.04em;color:#fff;background:#0B9A8B;
    border:0;border-radius:10px;padding:13px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#C0392B;font-size:12.5px;margin-top:12px;min-height:16px;font-weight:600}
  .foot{margin-top:16px;font-size:10.5px;color:#93A0AD}

async function derive(pass){
